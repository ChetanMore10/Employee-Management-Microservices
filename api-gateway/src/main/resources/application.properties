spring.application.name=api-gateway

server.port=8080

# =========================
# Eureka Configuration
# =========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

# =========================
# Gateway Route - Employee Service Route
# =========================
spring.cloud.gateway.server.webmvc.routes[0].id=employee-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/employee/**

# =========================
# Gateway Route - Address Service Route
# =========================
spring.cloud.gateway.server.webmvc.routes[1].id=address-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ADDRESS-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/address/**